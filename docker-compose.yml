version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - agent/.env
    depends_on:
      - backend
    restart: unless-stopped

# LiveKit is an external cloud service; configure LIVEKIT_URL, LIVEKIT_API_KEY,
# and LIVEKIT_API_SECRET in backend/.env and agent/.env to point at your project.
